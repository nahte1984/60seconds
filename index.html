<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007b26">
<meta name="description" content="這個時鐘每一秒鐘會隨機刪除自己的一些程式碼。">
<title>⏰ --:--</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #007b26; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  iframe.next { visibility: hidden; }
  .note { position: fixed; inset: auto 16px 16px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #fff; }
</style>
</head>
<body>
<script>
/*
  decayTime 60 — 殼（這一層不會壞）
  一載入就開始：每過一秒，從 clock.html 隨機刪掉一行。
  60 秒後全部刪光，下一秒回到完整，重新抽一個死亡順序，再來一遍。
  同一輪裡的亂數（配色、失控程式的選擇）都由這一輪的種子決定，透過 iframe 的 name 傳進去，
  所以每一秒重畫時只差少掉的那一行，不會整頁重抽、不會閃。
  ?s=40 → 停在「已經刪掉 40 行」的樣子（每次重整都是新的隨機組合）。
  ?src=other.html → 換一個檔案來毀壞（同資料夾內的 .html）。
*/
// the tab title always shows the real time
(function title() {
  const d = new Date();
  document.title = '⏰ ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  setTimeout(title, 1000 - (Date.now() % 1000) + 5);
})();

(async function () {
  const params = new URLSearchParams(location.search);
  const SOURCE = /^[\w.-]+\.html$/.test(params.get('src') || '') ? params.get('src') : 'clock.html';
  const q = (params.get('s') || '').match(/^\d{1,2}$/);
  const frozen = q ? Math.min(60, Number(q[0])) : null;

  let lines;
  try {
    const res = await fetch(SOURCE, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    lines = (await res.text()).split(/\r?\n/);
    if (lines[lines.length - 1] === '') lines.pop();
  } catch (err) {
    const p = document.createElement('p');
    p.className = 'note';
    p.textContent = '讀不到 ' + SOURCE + '。請放在同一個資料夾，並透過 http(s) 開啟（例如 GitHub Pages），file:// 無法讀取。';
    document.body.appendChild(p);
    return;
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let order, seed;
  // a new life: a fresh order of death (Fisher–Yates) and a fresh seed for everything random inside it
  function newRound() {
    order = lines.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    seed = 1 + Math.floor(Math.random() * 2147483645);
  }

  let current = null, pending = null, lastBg = '';
  // the background colour the clock is wearing right now, handed to the next second so it keeps gliding
  function bgOf(frame) {
    try {
      const b = frame.contentWindow.__bg;
      if (Array.isArray(b) && b.length === 3) return b.map((v) => (+v).toFixed(2)).join(',');
    } catch (e) { /* not readable */ }
    return '';
  }

  function render(k) {
    if (current) lastBg = bgOf(current) || lastBg;
    if (pending) { pending.remove(); pending = null; }   // a late second is dropped, never stacked
    const dead = new Set(order.slice(0, Math.round(k * lines.length / 60)));
    const html = lines.filter((_, i) => !dead.has(i)).join('\n');
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    const next = document.createElement('iframe');
    next.title = 'decayTime';
    next.name = ['decayTime', seed, lastBg, k].join('|');
    if (current) next.className = 'next';   // the old second stays on screen until the new one is fully drawn
    pending = next;
    let done = false;
    const swap = () => {
      if (done || pending !== next) return;
      done = true;
      pending = null;
      next.className = '';
      if (current) current.remove();
      current = next;
      URL.revokeObjectURL(url);
    };
    next.addEventListener('load', async () => {
      try {
        const w = next.contentWindow, d = next.contentDocument;
        await Promise.race([d.fonts.ready, wait(1500)]);
        await Promise.race([new Promise((r) => w.requestAnimationFrame(() => w.requestAnimationFrame(r))), wait(250)]);
      } catch (e) { /* show it anyway */ }
      swap();
    });
    setTimeout(swap, 3000);
    next.src = url;
    document.body.appendChild(next);
  }

  newRound();
  if (frozen !== null) {
    render(frozen);
  } else {
    // one round = 61 states: whole (0) … one line left (59) … nothing (60); every state lasts one second on the clock's own seconds
    let start = Date.now() - (Date.now() % 1000);
    if (Date.now() - start > 400) start += 1000;   // give the whole clock at least most of a second
    let shown = -1;
    const step = () => {
      let el = Math.floor((Date.now() + 20 - start) / 1000);
      if (el < 0) el = 0;
      if (el > 60) {                                // past the empty page: a new life
        start += 61000 * Math.floor(el / 61);
        el = Math.floor((Date.now() + 20 - start) / 1000);
        newRound();
        shown = -1;
      }
      if (el !== shown) { shown = el; render(el); }
      setTimeout(step, 1000 - ((Date.now() - start) % 1000) + 5);
    };
    step();
  }

  // the shell always wears whatever background the clock is wearing right now, so the browser's own bars can follow it:
  // Safari 26 tints them from the page's html/body background (and ignores theme-color); other browsers read theme-color,
  // which only understands plain hex. Nothing in the shell is position: fixed, so Safari has no other element to sample.
  const meta = document.querySelector('meta[name="theme-color"]');
  const clear = (c) => !c || c === 'transparent' || c === 'rgba(0, 0, 0, 0)';
  // the clock's colour comes back as color(srgb …) or rgb(…); a see-through colour is seen over white
  const toHex = (c) => {
    let m = c.match(/^color\(srgb ([\d.e+-]+) ([\d.e+-]+) ([\d.e+-]+)(?: \/ ([\d.e+-]+))?\)$/), v, a = 1;
    if (m) { v = [m[1], m[2], m[3]].map((x) => x * 255); if (m[4] !== undefined) a = +m[4]; }
    else if ((m = c.match(/^rgba?\(([\d.]+),\s*([\d.]+),\s*([\d.]+)(?:,\s*([\d.]+))?\)$/))) { v = [m[1], m[2], m[3]].map(Number); if (m[4] !== undefined) a = +m[4]; }
    else return c;
    return '#' + v.map((x) => Math.max(0, Math.min(255, Math.round(x * a + 255 * (1 - a)))).toString(16).padStart(2, '0')).join('');
  };
  let last = '', lastFrame = null;
  (function sync() {
    requestAnimationFrame(sync);
    let c = '';
    try {
      const win = current && current.contentWindow;
      const doc = win && win.document;
      if (doc && doc.documentElement) {
        c = win.getComputedStyle(doc.documentElement).backgroundColor;
        if (clear(c) && doc.body) c = win.getComputedStyle(doc.body).backgroundColor;
      }
    } catch (e) { /* not readable: leave as is */ }
    if (current && clear(c)) c = '#ffffff';   // a page with no background is a white page
    if (c) c = toHex(c);
    if (c && (c !== last || current !== lastFrame)) {
      last = c;
      lastFrame = current;
      document.documentElement.style.backgroundColor = c;
      document.body.style.backgroundColor = c;
      if (current) current.style.backgroundColor = c;
      if (meta) meta.content = c;
    }
  })();
})();
</script>
</body>
</html>
